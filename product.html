<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produk — Lyppe Store</title>
  <meta name="description" content="Lihat detail produk di Lyppe Store." />
  <meta name="theme-color" content="#fafaf8" />

  <!-- Open Graph (updated dynamically by product.js once the product loads) -->
  <meta property="og:type" content="product" />
  <meta property="og:title" content="Lyppe Store" />
  <meta property="og:description" content="Lihat detail produk di Lyppe Store." />
  <meta property="og:image" content="/assets/og-default.png" />
  <meta property="og:site_name" content="Lyppe Store" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Lyppe Store" />
  <meta name="twitter:description" content="Lihat detail produk di Lyppe Store." />
  <meta name="twitter:image" content="/assets/og-default.png" />

  <!-- Favicon -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/assets/favicon-32x32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/assets/favicon-16x16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!--
    Note (see README §SEO limitation): because this is a static-HTML +
    client-side-JS prototype, these meta tags are only updated after
    JavaScript runs. Crawlers/social bots that don't execute JS will
    see the generic fallback tags above. On migration to Next.js,
    replace this with generateMetadata() for true server-side SEO.
  -->

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand">Lyppe Store</a>
      <nav class="site-nav" aria-label="Navigasi utama">
        <a href="index.html">Produk</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <p class="state-message loading-text" id="productLoading">Memuat produk...</p>

      <section class="product-detail" id="productDetail" hidden>
        <div class="image-frame">
          <img id="productImage" src="" alt="" />
        </div>
        <div>
          <span class="eyebrow">Produk Digital</span>
          <h1 id="productName"></h1>
          <div class="price" id="productPrice"></div>
          <p class="description" id="productDescription"></p>

          <div class="action-row">
            <a class="btn" id="contactWhatsApp" href="#" target="_blank" rel="noopener">
              Hubungi Admin →
            </a>
            <a class="btn secondary" href="index.html">Kembali ke Katalog</a>
          </div>

          <div class="payment-box" id="qrisBox" hidden>
            <h2>Pembayaran</h2>
            <p class="hint">Scan QRIS untuk melakukan pembayaran.</p>
            <div class="qris-frame">
              <img id="qrisImage" src="" alt="" />
            </div>
            <p class="after-note">Setelah pembayaran, hubungi admin.</p>
          </div>
        </div>
      </section>

      <section class="not-found" id="productNotFound" hidden>
        <h1>Produk tidak ditemukan</h1>
        <p>Produk yang Anda cari tidak tersedia atau sudah tidak aktif.</p>
        <a class="btn" href="index.html">Kembali ke Katalog</a>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span id="footerStoreName">© Lyppe Store</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
